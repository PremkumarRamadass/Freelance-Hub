<header class="app-header">
  <!-- Search Bar -->
  <div class="search-container">
    <i class="pi pi-search search-icon"></i>
    <input
      type="text"
      class="search-input"
      placeholder="Search anything..."
    />
  </div>

  <!-- Right Actions -->
  <div class="header-actions">
    <!-- Role Badge (Static, no switching dropdown inside) -->
    <div class="user-role-badge" [class.client]="authService.isClient()" [class.admin]="authService.isAdmin()" [class.freelancer]="authService.isFreelancer()">
      <i [class]="authService.isClient() ? 'pi pi-building' : (authService.isAdmin() ? 'pi pi-shield' : 'pi pi-user')"></i>
      <span>{{ authService.userRole() }}</span>
    </div>

    <!-- Notifications -->
    <a routerLink="/notifications" class="action-icon-btn" title="Notifications">
      <i class="pi pi-bell"></i>
      @if (notificationService.unreadCount() > 0) {
        <span class="badge-dot"></span>
      }
    </a>

    <!-- User Profile Dropdown -->
    <div class="user-profile-menu">
      <button
        type="button"
        class="user-btn"
        (click)="showUserMenu.set(!showUserMenu())"
      >
        <img
          [src]="authService.currentUser()?.avatarUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'"
          alt="Avatar"
          class="user-avatar"
        />
        <div class="user-meta">
          <span class="user-name">{{ authService.currentUser()?.name }}</span>
          <span class="user-role">{{ authService.currentUser()?.role }}</span>
        </div>
        <i class="pi pi-chevron-down text-xs text-slate-400"></i>
      </button>

      @if (showUserMenu()) {
        <div class="user-dropdown">
          <div class="dropdown-header">
            <strong class="dropdown-user-name">{{ authService.currentUser()?.name }}</strong>
            <span class="dropdown-user-email" [title]="authService.currentUser()?.email || ''">
              {{ authService.currentUser()?.email }}
            </span>
          </div>
          <a routerLink="/settings" class="dropdown-item" (click)="showUserMenu.set(false)">
            <i class="pi pi-user"></i> Profile Settings
          </a>
          @if (!authService.isClient()) {
            <a routerLink="/reports" class="dropdown-item" (click)="showUserMenu.set(false)">
              <i class="pi pi-chart-pie"></i> Financial Reports
            </a>
          }
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item text-red-600" (click)="logout()">
            <i class="pi pi-sign-out"></i> Sign Out
          </button>
        </div>
      }
    </div>
  </div>
</header>
